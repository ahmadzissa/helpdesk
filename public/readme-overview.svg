<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Relay Helpdesk overview</title>
  <desc id="desc">A shared support workspace for receiving requests, collaborating on tickets, and resolving conversations.</desc>
  <rect width="1200" height="480" rx="24" fill="#f5f1fb"/>
  <circle cx="1100" cy="30" r="180" fill="#e9dff7"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="56" y="48" width="48" height="48" rx="13" fill="#7450bb"/>
    <path d="M71 83V66h7v4c2-4 5-5 10-5v7c-7-1-10 2-10 7v4" fill="#fff"/>
    <path d="M87 57h8v8m0-8-9 9" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="118" y="84" font-size="36" font-weight="700" fill="#34284b">relay.</text>
    <text x="56" y="157" font-size="38" font-weight="700" fill="#34284b">A calmer inbox. A happier team.</text>
    <text x="56" y="195" font-size="20" fill="#655775">Customer conversations, organized in one shared workspace.</text>
    <rect x="56" y="236" width="344" height="186" rx="16" fill="#fff"/>
    <rect x="428" y="236" width="344" height="186" rx="16" fill="#fff"/>
    <rect x="800" y="236" width="344" height="186" rx="16" fill="#fff"/>
    <g font-size="14" font-weight="700" fill="#7450bb" letter-spacing="2">
      <text x="80" y="272">01 / RECEIVE</text><text x="452" y="272">02 / COLLABORATE</text><text x="824" y="272">03 / RESOLVE</text>
    </g>
    <g font-size="23" font-weight="700" fill="#34284b">
      <text x="80" y="316">Bring mail together</text><text x="452" y="316">Give every ticket context</text><text x="824" y="316">Keep support moving</text>
    </g>
    <g font-size="18" fill="#655775">
      <text x="80" y="354">Multiple mailboxes</text><text x="80" y="383">Search, tags, and saved views</text>
      <text x="452" y="354">Teams, assignments, and notes</text><text x="452" y="383">Replies, drafts, and attachments</text>
      <text x="824" y="354">Automations and follow-ups</text><text x="824" y="383">Delivery tracking and reports</text>
    </g>
  </g>
</svg>
